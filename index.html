<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CAD 看圖測量" />
  <meta name="theme-color" content="#101417" />
  <title>CAD 看圖與測量工具 (原生 DWG / DXF)</title>
  <style>
    :root {
      --bg-canvas: #13171a;
      --bg-bar: #101417;
      --bg-panel: #181e22;
      --bg-btn: #1f262b;
      --bg-btn-hover: #293239;
      --accent: #3cd3ad;
      --accent-dark: #259c7e;
      --accent-text: #0b1f1a;
      --warn-bg: rgba(70, 52, 23, 0.90);
      --warn-border: #8b682e;
      --warn-text: #e6c68a;
      --text-main: #e2e8ec;
      --text-muted: #8a969e;
      --border: #2a3339;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-canvas); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .top-bar { position: fixed; top: 0; left: 0; right: 0; padding: calc(10px + var(--safe-top)) 12px 10px; background: var(--bg-bar); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; z-index: 30; }
    .btn-dark { background: var(--bg-btn); color: var(--text-main); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: var(--accent-text); border: none; border-radius: 10px; padding: 9px 16px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 2px 10px rgba(60, 211, 173, 0.25); }
    .banner { position: fixed; top: calc(58px + var(--safe-top)); left: 12px; right: 12px; background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5; z-index: 25; backdrop-filter: blur(6px); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .banner.hidden { display: none; }
    .banner-close { background: none; border: none; color: var(--warn-text); font-size: 16px; cursor: pointer; padding: 0 4px; }
    #cadCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(16, 20, 23, 0.78); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; backdrop-filter: blur(4px); }
    .loading-overlay.active { display: flex; }
    .spinner { width: 38px; height: 38px; border: 3px solid rgba(60, 211, 173, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .measure-hud { position: fixed; bottom: calc(76px + var(--safe-bottom)); left: 12px; right: 12px; background: rgba(24, 30, 34, 0.94); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; z-index: 25; display: none; flex-direction: column; gap: 8px; backdrop-filter: blur(8px); }
    .measure-hud.active { display: flex; }
    .hud-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--accent); font-weight: 600; }
    .hud-value { font-size: 18px; font-weight: 700; color: #fff; }
    .hud-sub { font-size: 12px; color: var(--text-muted); }
    .hud-actions { display: flex; gap: 8px; }
    .hud-btn { background: var(--bg-btn); color: var(--text-main); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 6px 6px calc(8px + var(--safe-bottom)); background: var(--bg-bar); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; z-index: 30; }
    .nav-item { background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); font-size: 11px; cursor: pointer; }
    .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.active { background: rgba(60, 211, 173, 0.14); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: none; align-items: flex-end; }
    .modal-backdrop.open { display: flex; }
    .drawer { width: 100%; max-height: 72vh; background: var(--bg-panel); border-top: 1px solid var(--border); border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .drawer-title { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .layer-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-btn); border-radius: 10px; }
    .layer-info { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #364149; border-radius: 24px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <header class="top-bar">
    <button class="btn-dark" id="btnLayers">圖層</button>
    <div style="display:flex; gap:8px; align-items:center;">
      <label class="btn-primary" for="fileInput">開啟 DXF / DWG</label>
      <input type="file" id="fileInput" accept=".dwg,.dxf" style="display:none;" />
      <button class="btn-dark" id="btnTopMore">更多</button>
    </div>
  </header>

  <div class="banner" id="statusBanner">
    <span id="bannerText">支援直接開啟原生 .DWG 與 .DXF 檔案（內建 WebAssembly CAD 引擎，免轉檔直接瀏覽與測量）</span>
    <button class="banner-close" id="btnCloseBanner">✕</button>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText" style="font-size:14px; color:#e2e8ec;">正在解析 DWG 圖檔幾何資料...</div>
  </div>

  <canvas id="cadCanvas"></canvas>

  <div class="measure-hud" id="measureHud">
    <div class="hud-header"><span id="hudTitle">測距模式</span><button class="hud-btn" id="btnClearMeasure">清除重測</button></div>
    <div class="hud-value" id="hudMainVal">請點擊起點</div>
    <div class="hud-sub" id="hudSubVal">靠近端點自動鎖點</div>
    <div class="hud-actions" id="hudUnitRow">
      <button class="hud-btn" data-unit="mm">mm</button>
      <button class="hud-btn" data-unit="cm">cm</button>
      <button class="hud-btn" data-unit="m">m</button>
    </div>
  </div>

  <nav class="bottom-bar">
    <button class="nav-item active" data-tool="pan"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/></svg><span>平移</span></button>
    <button class="nav-item" data-tool="select"><svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg><span>選取</span></button>
    <button class="nav-item" data-tool="dist"><svg viewBox="0 0 24 24"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/></svg><span>測距</span></button>
    <button class="nav-item" data-tool="area"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 2"/></svg><span>測坪數</span></button>
    <button class="nav-item" data-tool="fit"><svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/></svg><span>全圖</span></button>
    <button class="nav-item" data-tool="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg><span>更多</span></button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop"><div class="drawer" id="drawerContent"></div></div>

  <script type="module">
    const canvas = document.getElementById('cadCanvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight, dpr = window.devicePixelRatio || 1;
    let camera = { x: 0, y: 0, zoom: 1 }, currentTool = 'pan', unit = 'mm', showGrid = true, snapEnabled = true;
    let entities = [], layers = {}, selectedEntity = null, measurePoints = [], snapPoint = null;
    let libreDwgInstance = null, libreDwgModule = null;

    // AutoCAD 常用色號表 (ACI 1~255 常用色)
    const ACI_COLORS = {
      1: '#ff4d4d', 2: '#ffdf4d', 3: '#4dff88', 4: '#4dffff', 5: '#4d94ff',
      6: '#ff66ff', 7: '#e8eef2', 8: '#808a90', 9: '#b0bac0', 10: '#ff3333',
      30: '#ff9933', 40: '#ffcc33', 50: '#ffff33', 70: '#99ff33', 90: '#33ff66',
      130: '#33ffff', 150: '#3399ff', 170: '#3366ff', 210: '#cc66ff', 250: '#666666'
    };
    const getColor = (aci) => {
      if (
