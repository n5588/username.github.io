<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CAD 看圖測量" />
  <meta name="theme-color" content="#101417" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>CAD 看圖與測量工具 (原生 DWG / DXF)</title>
  <style>
    :root {
      --bg-canvas: #13171a;
      --bg-bar: #101417;
      --bg-panel: #181e22;
      --bg-btn: #1f262b;
      --bg-btn-hover: #293239;
      --accent: #3cd3ad;
      --accent-dark: #259c7e;
      --accent-text: #0b1f1a;
      --warn-bg: rgba(70, 52, 23, 0.92);
      --warn-border: #8b682e;
      --warn-text: #e6c68a;
      --text-main: #e2e8ec;
      --text-muted: #8a969e;
      --border: #2a3339;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-canvas); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .top-bar { position: fixed; top: 0; left: 0; right: 0; padding: calc(10px + var(--safe-top)) 12px 10px; background: var(--bg-bar); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; z-index: 30; }
    .btn-dark { background: var(--bg-btn); color: var(--text-main); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: var(--accent-text); border: none; border-radius: 10px; padding: 9px 16px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 2px 10px rgba(60, 211, 173, 0.25); }
    .banner { position: fixed; top: calc(58px + var(--safe-top)); left: 12px; right: 12px; background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5; z-index: 25; backdrop-filter: blur(6px); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .banner.hidden { display: none; }
    .banner-close { background: none; border: none; color: var(--warn-text); font-size: 16px; cursor: pointer; padding: 0 4px; }
    #cadCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(16, 20, 23, 0.82); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; backdrop-filter: blur(4px); }
    .loading-overlay.active { display: flex; }
    .spinner { width: 38px; height: 38px; border: 3px solid rgba(60, 211, 173, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .measure-hud { position: fixed; bottom: calc(76px + var(--safe-bottom)); left: 12px; right: 12px; background: rgba(24, 30, 34, 0.94); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; z-index: 25; display: none; flex-direction: column; gap: 8px; backdrop-filter: blur(8px); }
    .measure-hud.active { display: flex; }
    .hud-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--accent); font-weight: 600; }
    .hud-value { font-size: 18px; font-weight: 700; color: #fff; }
    .hud-sub { font-size: 12px; color: var(--text-muted); }
    .hud-actions { display: flex; gap: 8px; }
    .hud-btn { background: var(--bg-btn); color: var(--text-main); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 6px 6px calc(8px + var(--safe-bottom)); background: var(--bg-bar); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; z-index: 30; }
    .nav-item { background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); font-size: 11px; cursor: pointer; }
    .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.active { background: rgba(60, 211, 173, 0.14); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: none; align-items: flex-end; }
    .modal-backdrop.open { display: flex; }
    .drawer { width: 100%; max-height: 72vh; background: var(--bg-panel); border-top: 1px solid var(--border); border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .drawer-title { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .layer-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-btn); border-radius: 10px; }
    .layer-info { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #364149; border-radius: 24px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <header class="top-bar">
    <button class="btn-dark" id="btnLayers">圖層</button>
    <div style="display:flex; gap:8px; align-items:center;">
      <label class="btn-primary" for="fileInput">開啟 DXF / DWG</label>
      <input type="file" id="fileInput" accept=".dwg,.dxf" style="display:none;" />
      <button class="btn-dark" id="btnTopMore">更多</button>
    </div>
  </header>

  <div class="banner" id="statusBanner">
    <span id="bannerText">支援直接開啟原生 .DWG 與 .DXF 檔案（自動載入 WebAssembly CAD 解析引擎）</span>
    <button class="banner-close" id="btnCloseBanner">✕</button>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText" style="font-size:14px; color:#e2e8ec; text-align:center; padding:0 20px;">正在解析 DWG 圖檔幾何資料...</div>
  </div>

  <canvas id="cadCanvas"></canvas>

  <div class="measure-hud" id="measureHud">
    <div class="hud-header"><span id="hudTitle">測距模式</span><button class="hud-btn" id="btnClearMeasure">清除重測</button></div>
    <div class="hud-value" id="hudMainVal">請點擊起點</div>
    <div class="hud-sub" id="hudSubVal">靠近端點自動鎖點</div>
    <div class="hud-actions" id="hudUnitRow">
      <button class="hud-btn" data-unit="mm">mm</button>
      <button class="hud-btn" data-unit="cm">cm</button>
      <button class="hud-btn" data-unit="m">m</button>
    </div>
  </div>

  <nav class="bottom-bar">
    <button class="nav-item active" data-tool="pan"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/></svg><span>平移</span></button>
    <button class="nav-item" data-tool="select"><svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg><span>選取</span></button>
    <button class="nav-item" data-tool="dist"><svg viewBox="0 0 24 24"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/></svg><span>測距</span></button>
    <button class="nav-item" data-tool="area"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 2"/></svg><span>測坪數</span></button>
    <button class="nav-item" data-tool="fit"><svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/></svg><span>全圖</span></button>
    <button class="nav-item" data-tool="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg><span>更多</span></button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop"><div class="drawer" id="drawerContent"></div></div>

  <script type="module">
    const canvas = document.getElementById('cadCanvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight, dpr = window.devicePixelRatio || 1;
    let camera = { x: 0, y: 0, zoom: 1 }, currentTool = 'pan', unit = 'mm', showGrid = true, snapEnabled = true;
    let entities = [], layers = {}, selectedEntity = null, measurePoints = [], snapPoint = null;
    let libreDwgInstance = null, libreDwgModule = null;

    const ACI_COLORS = {
      1: '#ff4d4d', 2: '#ffdf4d', 3: '#4dff88', 4: '#4dffff', 5: '#4d94ff',
      6: '#ff66ff', 7: '#e8eef2', 8: '#808a90', 9: '#b0bac0', 10: '#ff3333',
      30: '#ff9933', 40: '#ffcc33', 50: '#ffff33', 70: '#99ff33', 90: '#33ff66',
      130: '#33ffff', 150: '#3399ff', 170: '#3366ff', 210: '#cc66ff', 250: '#666666'
    };
    const getColor = (aci) => {
      if (!aci || aci === 256 || aci === 0) return null;
      const idx = Math.abs(aci);
      return ACI_COLORS[idx] || `hsl(${(idx * 37) % 360}, 85%, 65%)`;
    };

    function showBanner(msg) {
      document.getElementById('bannerText').textContent = msg;
      document.getElementById('statusBanner').classList.remove('hidden');
    }

    function setLoading(active, text = '正在解析圖檔...') {
      const ov = document.getElementById('loadingOverlay');
      document.getElementById('loadingText').textContent = text;
      ov.classList.toggle('active', active);
    }

    // 多重來源載入 LibreDWG WASM 引擎，並正確處理 GitHub Pages 與 APK 本地路徑
    async function ensureLibreDwg() {
      if (libreDwgInstance && libreDwgModule) return { lib: libreDwgInstance, mod: libreDwgModule };
      setLoading(true, '首次開啟 DWG，正在載入 CAD 解析引擎 (約 3MB)...');

      const candidates = [
        // 1. 本機打包路徑 (APK 離線包)
        {
          js: new URL('./vendor/libredwg-web/dist/libredwg-web.js', window.location.href).href,
          wasm: new URL('./vendor/libredwg-web/wasm/', window.location.href).href
        },
        // 2. esm.sh 自動解析相依與 WASM
        {
          js: 'https://esm.sh/@mlightcad/libredwg-web@0.8.6',
          wasm: 'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@0.8.6/wasm/'
        },
        // 3. jsDelivr +esm 打包入口
        {
          js: 'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@0.8.6/+esm',
          wasm: 'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@0.8.6/wasm/'
        },
        // 4. unpkg 備援
        {
          js: 'https://unpkg.com/@mlightcad/libredwg-web@0.8.6/dist/libredwg-web.js',
          wasm: 'https://unpkg.com/@mlightcad/libredwg-web@0.8.6/wasm/'
        }
      ];

      let lastError = null;
      for (const src of candidates) {
        try {
          const mod = await import(src.js);
          const LibreDwgClass = mod.LibreDwg || mod.default?.LibreDwg || mod.default;
          if (!LibreDwgClass || typeof LibreDwgClass.create !== 'function') {
            throw new Error('模組格式不相容');
          }
          // 同時設定全域 locateFile 備援，避免 Emscripten 預設在網頁根目錄尋找 libredwg.wasm
          window.Module = window.Module || {};
          window.Module.locateFile = (file) => file.endsWith('.wasm') ? (src.wasm + file) : file;

          const lib = await LibreDwgClass.create(src.wasm);
          libreDwgModule = mod;
          libreDwgInstance = lib;
          return { lib, mod };
        } catch (err) {
          lastError = err;
          console.warn('DWG 引擎來源嘗試失敗:', src.js, err);
        }
      }
      throw new Error(`無法載入 DWG 解析引擎 (${lastError?.message || '網路或瀏覽器限制'})`);
    }

    function convertDwgDatabaseToScene(db, fileName) {
      const newLayers = {};
      const layerEntries = db?.tables?.LAYER?.entries || [];
      for (const lyr of layerEntries) {
        const name = lyr.name || '0';
        const col = getColor(lyr.colorIndex ?? lyr.color) || '#4dffff';
        newLayers[name] = { color: col, visible: !(lyr.off || lyr.frozen) };
      }
      if (!newLayers['0']) newLayers['0'] = { color: '#e8eef2', visible: true };

      const blockMap = {};
      const blockEntries = db?.tables?.BLOCK_RECORD?.entries || [];
      for (const blk of blockEntries) {
        if (blk.name && Array.isArray(blk.entities)) {
          blockMap[blk.name] = blk;
        }
      }

      const newEntities = [];
      let unsupportedCount = 0;

      function extractEntities(entList, tx = 0, ty = 0, sx = 1, sy = 1, rot = 0, parentLayer = null, depth = 0) {
        if (!Array.isArray(entList) || depth > 5) return;
        const cosR = Math.cos(rot), sinR = Math.sin(rot);
        const transformPt = (px, py) => {
          const x = px * sx, y = py * sy;
          return {
            x: tx + (x * cosR - y * sinR),
            y: -(ty + (x * sinR + y * cosR))
          };
        };

        for (const e of entList) {
          const layerName = (e.layer && e.layer !== '0') ? e.layer : (parentLayer || e.layer || '0');
          if (!newLayers[layerName]) newLayers[layerName] = { color: '#4dffff', visible: true };
          const entColor = getColor(e.colorIndex ?? e.color) || newLayers[layerName].color;

          if (e.type === 'LINE' && e.startPoint && e.endPoint) {
            const p1 = transformPt(e.startPoint.x, e.startPoint.y);
            const p2 = transformPt(e.endPoint.x, e.endPoint.y);
            newEntities.push({ type: 'LINE', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, layer: layerName, color: entColor });
          } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && Array.isArray(e.vertices) && e.vertices.length > 1) {
            const pts = e.vertices.map(v => transformPt(v.x, v.y));
            for (let i = 0; i < pts.length - 1; i++) {
              newEntities.push({ type: 'LINE', x1: pts[i].x, y1: pts[i].y, x2: pts[i+1].x, y2: pts[i+1].y, layer: layerName, color: entColor });
            }
            const isClosed = e.closed || ((e.flag & 1) === 1);
            if (isClosed && pts.length > 2) {
              newEntities.push({ type: 'LINE', x1: pts[pts.length-1].x, y1: pts[pts.length-1].y, x2: pts[0].x, y2: pts[0].y, layer: layerName, color: entColor });
            }
          } else if (e.type === 'CIRCLE' && e.center && e.radius) {
            const c = transformPt(e.center.x, e.center.y);
            newEntities.push({ type: 'CIRCLE', cx: c.x, cy: c.y, r: e.radius * Math.abs(sx), layer: layerName, color: entColor });
          } else if (e.type === 'ARC' && e.center && e.radius) {
            const c = transformPt(e.center.x, e.center.y);
            newEntities.push({
              type: 'ARC', cx: c.x, cy: c.y, r: e.radius * Math.abs(sx),
              startAngle: -(e.endAngle || 0) - rot,
              endAngle: -(e.startAngle || 0) - rot,
              layer: layerName, color: entColor
            });
          } else if ((e.type === 'TEXT' || e.type === 'MTEXT') && (e.startPoint || e.insertionPoint)) {
            const rawPt = e.startPoint || e.insertionPoint;
            const p = transformPt(rawPt.x, rawPt.y);
            const txt = (e.text || '').replace(/\[A-Za-z0-9]+;|\{|\}/g, '');
            if (txt.trim()) {
              newEntities.push({ type: 'TEXT', x: p.x, y: p.y, text: txt, height: (e.textHeight || e.height || 120) * Math.abs(sy), layer: layerName, color: entColor });
            }
          } else if (e.type === 'INSERT' && e.name && blockMap[e.name]) {
            const ins = e.insertionPoint || { x: 0, y: 0 };
            const bBase = blockMap[e.name].basePoint || { x: 0, y: 0 };
            const isx = e.xScale || 1, isy = e.yScale || 1, irot = e.rotation || 0;
            const nx = tx + ((ins.x - bBase.x * isx) * cosR - (ins.y - bBase.y * isy) * sinR);
            const ny = ty + ((ins.x - bBase.x * isx) * sinR + (ins.y - bBase.y * isy) * cosR);
            extractEntities(blockMap[e.name].entities, nx, ny, sx * isx, sy * isy, rot + irot, layerName, depth + 1);
          } else {
            unsupportedCount++;
          }
        }
      }

      extractEntities(db?.entities || []);

      if (newEntities.length === 0) {
        throw new Error('此 DWG 模型空間未包含可繪製的幾何線段（可能僅含圖紙配置 Layout 或外部參考）。');
      }

      entities = newEntities;
      layers = newLayers;
      selectedEntity = null;
      measurePoints = [];
      const extraMsg = unsupportedCount > 0 ? `（另有 ${unsupportedCount} 筆填充/標註物件以簡化模式略過）` : '';
      showBanner(`已直接載入原生 DWG：${fileName} | 共 ${entities.length} 筆幾何物件 · ${Object.keys(layers).length} 個圖層${extraMsg}`);
      fitToScreen();
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const lowerName = file.name.toLowerCase();

      try {
        if (lowerName.endsWith('.dwg')) {
          const { lib, mod } = await ensureLibreDwg();
          setLoading(true, `正在解析原生 DWG：${file.name}...`);
          const buffer = await file.arrayBuffer();
          await new Promise(r => setTimeout(r, 60));
          const fileType = mod.Dwg_File_Type ? mod.Dwg_File_Type.DWG : 0;
          const dwgPtr = lib.dwg_read_data(buffer, fileType);
          if (!dwgPtr) throw new Error('DWG 檔案損毀或版本不受支援。');
          const db = lib.convert(dwgPtr);
          lib.dwg_free(dwgPtr);
          convertDwgDatabaseToScene(db, file.name);
        } else {
          setLoading(true, `正在解析 DXF：${file.name}...`);
          const text = await file.text();
          parseAsciiDXF(text, file.name);
        }
      } catch (err) {
        showBanner(`載入失敗：${err.message || err}`);
      } finally {
        setLoading(false);
        e.target.value = '';
      }
    });

    function parseAsciiDXF(text, fileName) {
      const lines = text.split(/?
/);
      const parsedEntities = [], parsedLayers = { '0': { color: '#e8eef2', visible: true } };
      let inEntities = false, curr = null, polyPts = [];

      const flush = () => {
        if (!curr) return;
        if (!parsedLayers[curr.layer]) parsedLayers[curr.layer] = { color: '#4dffff', visible: true };
        const col = getColor(curr.aci) || parsedLayers[curr.layer].color;
        if (curr.type === 'LINE' && curr.x1 !== undefined && curr.x2 !== undefined) {
          parsedEntities.push({ type: 'LINE', x1: curr.x1, y1: curr.y1, x2: curr.x2, y2: curr.y2, layer: curr.layer, color: col });
        } else if (curr.type === 'CIRCLE' && curr.x1 !== undefined && curr.r !== undefined) {
          parsedEntities.push({ type: 'CIRCLE', cx: curr.x1, cy: curr.y1, r: curr.r, layer: curr.layer, color: col });
        } else if (curr.type === 'LWPOLYLINE' && polyPts.length > 1) {
          for (let i = 0; i < polyPts.length - 1; i++) {
            parsedEntities.push({ type: 'LINE', x1: polyPts[i].x, y1: polyPts[i].y, x2: polyPts[i+1].x, y2: polyPts[i+1].y, layer: curr.layer, color: col });
          }
          if ((curr.flags & 1) === 1 && polyPts.length > 2) {
            parsedEntities.push({ type: 'LINE', x1: polyPts[polyPts.length-1].x, y1: polyPts[polyPts.length-1].y, x2: polyPts[0].x, y2: polyPts[0].y, layer: curr.layer, color: col });
          }
        }
      };

      for (let i = 0; i < lines.length - 1; i += 2) {
        const c = lines[i].trim(), v = lines[i + 1].trim();
        if (c === '2' && v === 'ENTITIES') { inEntities = true; continue; }
        if (c === '0' && v === 'ENDSEC' && inEntities) { flush(); break; }
        if (!inEntities) continue;
        if (c === '0') { flush(); curr = { type: v, layer: '0', aci: 256 }; polyPts = []; }
        else if (curr) {
          if (c === '8') curr.layer = v;
          else if (c === '62') curr.aci = parseInt(v, 10);
          else if (c === '10') { if (curr.type === 'LWPOLYLINE') polyPts.push({ x: parseFloat(v), y: 0 }); else curr.x1 = parseFloat(v); }
          else if (c === '20') { if (curr.type === 'LWPOLYLINE' && polyPts.length) polyPts[polyPts.length-1].y = -parseFloat(v); else curr.y1 = -parseFloat(v); }
          else if (c === '11') curr.x2 = parseFloat(v);
          else if (c === '21') curr.y2 = -parseFloat(v);
          else if (c === '40') curr.r = parseFloat(v);
          else if (c === '70') curr.flags = parseInt(v, 10);
        }
      }
      if (!parsedEntities.length) throw new Error('無法解析此 DXF 檔案內容。');
      entities = parsedEntities; layers = parsedLayers;
      showBanner(`已載入 DXF：${fileName} | 共 ${entities.length} 筆幾何物件 · ${Object.keys(layers).length} 個圖層`);
      fitToScreen();
    }

    function resizeCanvas() {
      width = window.innerWidth; height = window.innerHeight; dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr; canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); render();
    }
    window.addEventListener('resize', resizeCanvas);

    const worldToScreen = (wx, wy) => ({ x: wx * camera.zoom + camera.x, y: wy * camera.zoom + camera.y });
    const screenToWorld = (sx, sy) => ({ x: (sx - camera.x) / camera.zoom, y: (sy - camera.y) / camera.zoom });

    function fitToScreen() {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, ok = false;
      for (const e of entities) {
        if (layers[e.layer] && !layers[e.layer].visible) continue;
        ok = true;
        if (e.type === 'LINE') { minX = Math.min(minX, e.x1, e.x2); minY = Math.min(minY, e.y1, e.y2); maxX = Math.max(maxX, e.x1, e.x2); maxY = Math.max(maxY, e.y1, e.y2); }
        else if (e.type === 'CIRCLE' || e.type === 'ARC') { minX = Math.min(minX, e.cx - e.r); minY = Math.min(minY, e.cy - e.r); maxX = Math.max(maxX, e.cx + e.r); maxY = Math.max(maxY, e.cy + e.r); }
      }
      if (!ok) return;
      const zoom = Math.min((width * 0.78) / (maxX - minX || 100), (height * 0.58) / (maxY - minY || 100));
      camera.zoom = zoom; camera.x = width / 2 - ((minX + maxX) / 2) * zoom; camera.y = height / 2 - ((minY + maxY) / 2) * zoom + 20;
      render();
    }

    function render() {
      ctx.fillStyle = '#13171a'; ctx.fillRect(0, 0, width, height);
      if (showGrid) {
        let step = 1000 * camera.zoom; while (step < 32) step *= 5; while (step > 160) step /= 5;
        ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 1; ctx.beginPath();
        for (let x = camera.x % step; x < width; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
        for (let y = camera.y % step; y < height; y += step) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
        ctx.stroke();
      }
      ctx.save(); ctx.translate(camera.x, camera.y); ctx.scale(camera.zoom, camera.zoom);
      for (const e of entities) {
        if (layers[e.layer] && !layers[e.layer].visible) continue;
        const isSel = e === selectedEntity;
        ctx.strokeStyle = isSel ? '#ffffff' : e.color;
        ctx.lineWidth = (isSel ? 3 : (e.lineWidth || 1.15)) / camera.zoom;
        if (e.type === 'LINE') { ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke(); }
        else if (e.type === 'CIRCLE') { ctx.beginPath(); ctx.arc(e.cx, e.cy, e.r, 0, Math.PI * 2); ctx.stroke(); }
        else if (e.type === 'ARC') { ctx.beginPath(); ctx.arc(e.cx, e.cy, e.r, e.startAngle, e.endAngle); ctx.stroke(); }
        else if (e.type === 'TEXT' && camera.zoom * e.height > 6) {
          ctx.fillStyle = e.color;
          ctx.font = `${e.height}px sans-serif`;
          ctx.fillText(e.text, e.x, e.y);
        }
      }
      if (measurePoints.length > 0) {
        ctx.strokeStyle = '#3cd3ad'; ctx.fillStyle = 'rgba(60,211,173,0.18)'; ctx.lineWidth = 2.2 / camera.zoom;
        ctx.beginPath(); ctx.moveTo(measurePoints[0].x, measurePoints[0].y);
        for (let i = 1; i < measurePoints.length; i++) ctx.lineTo(measurePoints[i].x, measurePoints[i].y);
        if (currentTool === 'area' && measurePoints.length >= 3) { ctx.closePath(); ctx.fill(); }
        ctx.stroke();
      }
      if (snapPoint && (currentTool === 'dist' || currentTool === 'area')) {
        const s = 7 / camera.zoom; ctx.strokeStyle = '#4dff88'; ctx.lineWidth = 2 / camera.zoom;
        ctx.strokeRect(snapPoint.x - s, snapPoint.y - s, s * 2, s * 2);
      }
      ctx.restore();
    }

    function findSnapPoint(sx, sy) {
      if (!snapEnabled) return screenToWorld(sx, sy);
      let bestDist = 18, bestPt = null;
      for (const e of entities) {
        if (layers[e.layer] && !layers[e.layer].visible) continue;
        const pts = e.type === 'LINE' ? [{x:e.x1,y:e.y1},{x:e.x2,y:e.y2}] : (e.type === 'CIRCLE' || e.type === 'ARC') ? [{x:e.cx,y:e.cy}] : [];
        for (const c of pts) {
          const sp = worldToScreen(c.x, c.y), d = Math.hypot(sp.x - sx, sp.y - sy);
          if (d < bestDist) { bestDist = d; bestPt = c; }
        }
      }
      return bestPt;
    }

    const fmtLen = v => unit === 'mm' ? `${v.toFixed(1)} mm` : unit === 'cm' ? `${(v/10).toFixed(2)} cm` : `${(v/1000).toFixed(3)} m`;

    function updateMeasureHUD() {
      const hud = document.getElementById('measureHud'), title = document.getElementById('hudTitle'), main = document.getElementById('hudMainVal'), sub = document.getElementById('hudSubVal');
      if (currentTool === 'dist') {
        hud.classList.add('active'); title.textContent = '測距模式';
        if (measurePoints.length < 2) { main.textContent = measurePoints.length === 0 ? '請點擊起點' : '請點擊終點'; sub.textContent = '靠近端點自動吸附'; }
        else {
          let total = 0; for (let i=1;i<measurePoints.length;i++) total += Math.hypot(measurePoints[i].x-measurePoints[i-1].x, measurePoints[i].y-measurePoints[i-1].y);
          main.textContent = `總長: ${fmtLen(total)}`; sub.textContent = '可繼續點擊累加';
        }
      } else if (currentTool === 'area') {
        hud.classList.add('active'); title.textContent = '測坪數模式';
        if (measurePoints.length < 3) { main.textContent = `已選 ${measurePoints.length} 點`; sub.textContent = '至少需 3 點圍閉'; }
        else {
          let a = 0; for (let i=0;i<measurePoints.length;i++) { const j=(i+1)%measurePoints.length; a += measurePoints[i].x*measurePoints[j].y - measurePoints[j].x*measurePoints[i].y; }
          const m2 = Math.abs(a)/2/1000000; main.textContent = `${(m2*0.3025).toFixed(2)} 坪 (${m2.toFixed(2)} m²)`; sub.textContent = '1 m² = 0.3025 坪';
        }
      } else hud.classList.remove('active');
    }

    let isDragging = false, dragMoved = false, lastTouch = {x:0,y:0}, pinchDist = 0;
    canvas.addEventListener('pointerdown', e => { isDragging = true; dragMoved = false; lastTouch = {x:e.clientX, y:e.clientY}; });
    canvas.addEventListener('pointermove', e => {
      snapPoint = (currentTool === 'dist' || currentTool === 'area') ? findSnapPoint(e.clientX, e.clientY) : null;
      if (isDragging) {
        const dx = e.clientX - lastTouch.x, dy = e.clientY - lastTouch.y;
        if (Math.hypot(dx, dy) > 4) dragMoved = true;
        camera.x += dx; camera.y += dy; lastTouch = {x:e.clientX, y:e.clientY};
      }
      render();
    });
    canvas.addEventListener('pointerup', e => {
      if (!dragMoved && (currentTool === 'dist' || currentTool === 'area')) {
        measurePoints.push(findSnapPoint(e.clientX, e.clientY) || screenToWorld(e.clientX, e.clientY));
        updateMeasureHUD();
      }
      isDragging = false; render();
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const f = e.deltaY < 0 ? 1.15 : 0.87, wx = (e.clientX - camera.x)/camera.zoom, wy = (e.clientY - camera.y)/camera.zoom;
      camera.zoom *= f; camera.x = e.clientX - wx * camera.zoom; camera.y = e.clientY - wy * camera.zoom; render();
    }, { passive: false });
    canvas.addEventListener('touchstart', e => { if (e.touches.length === 2) { isDragging = false; pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } }, {passive:true});
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchDist > 0) {
        const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const mx = (e.touches[0].clientX + e.touches[1].clientX)/2, my = (e.touches[0].clientY + e.touches[1].clientY)/2;
        const f = nd / pinchDist, wx = (mx - camera.x)/camera.zoom, wy = (my - camera.y)/camera.zoom;
        camera.zoom *= f; camera.x = mx - wx * camera.zoom; camera.y = my - wy * camera.zoom; pinchDist = nd; render();
      }
    }, {passive:true});

    document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.tool;
      if (t === 'fit') return fitToScreen();
      if (t === 'more') return;
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active')); b.classList.add('active');
      currentTool = t; measurePoints = []; updateMeasureHUD(); render();
    }));
    document.querySelectorAll('[data-unit]').forEach(b => b.addEventListener('click', () => { unit = b.dataset.unit; updateMeasureHUD(); }));
    document.getElementById('btnClearMeasure').addEventListener('click', () => { measurePoints = []; updateMeasureHUD(); render(); });
    document.getElementById('btnCloseBanner').addEventListener('click', () => document.getElementById('statusBanner').classList.add('hidden'));
    document.getElementById('btnLayers').addEventListener('click', () => {
      let h = '<div class="drawer-title"><span>圖層管理</span><button class="hud-btn" onclick="document.getElementById(\'modalBackdrop\').classList.remove(\'open\')">完成</button></div>';
      for (const [k, v] of Object.entries(layers)) {
        const safeKey = k.replace(/'/g, "\\'");
        h += `<div class="layer-row"><div class="layer-info"><span class="color-dot" style="background:${v.color}"></span><span>${k}</span></div><label class="switch"><input type="checkbox" ${v.visible?'checked':''} onchange="window.__toggleLayer('${safeKey}', this.checked)"><span class="slider"></span></label></div>`;
      }
      document.getElementById('drawerContent').innerHTML = h; document.getElementById('modalBackdrop').classList.add('open');
    });
    window.__toggleLayer = (k, val) => { if (layers[k]) { layers[k].visible = val; render(); } };

    layers = { '0': { color: '#4dffff', visible: true } };
    entities = [
      { type: 'LINE', x1: -2000, y1: -1200, x2: 2000, y2: -1200, layer: '0', color: '#ffdf4d', lineWidth: 1.6 },
      { type: 'LINE', x1: 2000, y1: -1200, x2: 2000, y2: 1200, layer: '0', color: '#ffdf4d', lineWidth: 1.6 },
      { type: 'LINE', x1: 2000, y1: 1200, x2: -2000, y2: 1200, layer: '0', color: '#ffdf4d', lineWidth: 1.6 },
      { type: 'LINE', x1: -2000, y1: 1200, x2: -2000, y2: -1200, layer: '0', color: '#ffdf4d', lineWidth: 1.6 }
    ];
    resizeCanvas();
    fitToScreen();
  </script>
</body>
</html>
